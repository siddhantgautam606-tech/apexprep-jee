name: Build PrepXAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply PrepXAI Android branding and version
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26

          # Same Lucide Flame shape used by the PrepXAI website header.
          cat > android/app/src/main/res/drawable/prepxai_flame_foreground.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M8.5,14.5A2.5,2.5 0,0 0,11,12c0,-1.38 -0.5,-2 -1,-3 -1.072,-1.143 -1.5,-2 -1.5,-3.5 0,0 -4.5,2.5 -4.5,7.5a6.5,6.5 0,0 0,13,0c0,-1.22 -0.25,-2.15 -0.55,-3A5.5,5.5 0,0 1,13,14.5a2.5,2.5 0,0 0,-5,0Z" />
          </vector>
          XML

          cat > android/app/src/main/res/drawable/prepxai_icon_background.xml <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#4F46E5" />
          </shape>
          XML

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/prepxai_icon_background" />
            <foreground android:drawable="@drawable/prepxai_flame_foreground" />
            <monochrome android:drawable="@drawable/prepxai_flame_foreground" />
          </adaptive-icon>
          XML

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/prepxai_icon_background" />
            <foreground android:drawable="@drawable/prepxai_flame_foreground" />
            <monochrome android:drawable="@drawable/prepxai_flame_foreground" />
          </adaptive-icon>
          XML

          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@drawable/prepxai_icon"', 'android:icon="@mipmap/ic_launcher"')
          s = s.replace('android:roundIcon="@drawable/prepxai_icon"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          p.write_text(s)
          assert '@mipmap/ic_launcher' in s
          PY

          sed -i 's/versionCode [0-9][0-9]*/versionCode 3/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.2"/' android/app/build.gradle

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload PrepXAI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepXAI-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to website
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/PrepXAI.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/PrepXAI.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest PrepXAI Android APK"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git pull --rebase origin main
            done
            exit 1
          fi
