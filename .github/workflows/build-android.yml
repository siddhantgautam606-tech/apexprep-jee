name: Build PrepXAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply exact PrepXAI app icon and version
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi

          # Use the exact app-icon artwork supplied for PrepXAI.
          cp public/prepxai_app_icon.jpg android/app/src/main/res/drawable-nodpi/prepxai_icon.jpg

          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/prepxai_icon"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/prepxai_icon"', s, count=1)
          else:
              s = s.replace('android:icon="@drawable/prepxai_icon"', 'android:icon="@drawable/prepxai_icon"\n        android:roundIcon="@drawable/prepxai_icon"', 1)
          p.write_text(s)
          assert 'android:icon="@drawable/prepxai_icon"' in s
          PY

          sed -i 's/versionCode [0-9][0-9]*/versionCode 3/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.2"/' android/app/build.gradle

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload PrepXAI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepXAI-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to website
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/PrepXAI.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/PrepXAI.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest PrepXAI Android APK"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git pull --rebase origin main
            done
            exit 1
          fi

# Exact supplied icon build.
