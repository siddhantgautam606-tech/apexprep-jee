name: Build PrepXAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Refresh lockfile for Capacitor mobile plugins
        run: npm install --package-lock-only

      - name: Commit lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
          else
            git commit -m "Update npm lockfile for mobile dependencies"
            git push origin HEAD:main
          fi

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply exact PrepXAI app icon and version
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi

          # Use the exact app-icon artwork supplied for PrepXAI.
          cp public/prepxai_app_icon.jpg android/app/src/main/res/drawable-nodpi/prepxai_icon.jpg

          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/prepxai_icon"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/prepxai_icon"', s, count=1)
          else:
              s = s.replace('android:icon="@drawable/prepxai_icon"', 'android:icon="@drawable/prepxai_icon"\n        android:roundIcon="@drawable/prepxai_icon"', 1)
          p.write_text(s)
          assert 'android:icon="@drawable/prepxai_icon"' in s
          PY

          sed -i 's/versionCode [0-9][0-9]*/versionCode 6/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.5"/' android/app/build.gradle

          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          # Release builds are smaller and faster while retaining the existing
          # debug signing identity used by the currently distributed APK.
          s = re.sub(r'(release\\s*\\{[^{}]*?)minifyEnabled\\s+false', r'\\1minifyEnabled true', s, count=1, flags=re.S)
          if 'shrinkResources true' not in s:
              s = re.sub(r'(release\\s*\\{[^{}]*?minifyEnabled\\s+true)', r'\\1\\n            shrinkResources true', s, count=1, flags=re.S)
          if 'signingConfig signingConfigs.debug' not in s:
              s = re.sub(r'(release\\s*\\{)', r'\\1\\n            signingConfig signingConfigs.debug', s, count=1)
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<intent-filter>\\n                <action android:name="android.intent.action.VIEW" />'
          if 'co.prepxai.app' not in s:
              intent = '''            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="co.prepxai.app" android:host="auth" android:pathPrefix="/callback" />
            </intent-filter>\n'''
              s = s.replace('</activity>', intent + '        </activity>', 1)
          p.write_text(s)
          assert 'co.prepxai.app' in s
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build optimized release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload PrepXAI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepXAI-Android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to website
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" public/PrepXAI.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/PrepXAI.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest PrepXAI Android APK"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git pull --rebase origin main
            done
            exit 1
          fi

# Exact supplied icon build.
