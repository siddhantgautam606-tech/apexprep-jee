name: Build and Publish PrepXAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply PrepXAI icon, version, and OAuth deep link
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp public/prepxai_app_icon.jpg android/app/src/main/res/drawable-nodpi/prepxai_icon.jpg

          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/prepxai_icon"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/prepxai_icon"', s, count=1)
          else:
              s = s.replace(
                  'android:icon="@drawable/prepxai_icon"',
                  'android:icon="@drawable/prepxai_icon"\n        android:roundIcon="@drawable/prepxai_icon"',
                  1
              )

          if 'co.prepxai.app' not in s:
              intent = '''            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="co.prepxai.app" android:host="auth" android:pathPrefix="/callback" />
            </intent-filter>
'''
              s = s.replace('</activity>', intent + '        </activity>', 1)

          manifest.write_text(s)
          assert '@drawable/prepxai_icon' in s
          assert 'co.prepxai.app' in s

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text()
          g = re.sub(r'versionCode\s+\d+', 'versionCode 6', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.5"', g, count=1)
          gradle.write_text(g)
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" PrepXAI-1.0.5.apk
          ls -lh PrepXAI-1.0.5.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: PrepXAI Android v1.0.5
          body: |
            PrepXAI Android app version 1.0.5.
            This release contains the current production Android APK.
          files: PrepXAI-1.0.5.apk
          overwrite_files: true
          make_latest: true
