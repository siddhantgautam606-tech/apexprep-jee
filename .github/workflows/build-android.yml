name: Build PrepXAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply PrepXAI Android branding and version
        run: |
          test -f public/icon-192.png
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/prepxai_flame.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,2c0,0 -4.5,4.5 -4.5,8.5 0,1.4 0.4,2.7 1.1,3.8C7.2,13.6 6,15.5 6,17.5 6,21.1 8.7,23 12,23s6,-1.9 6,-5.5c0,-2 -1.2,-3.9 -2.6,-5.2 0.7,-1.1 1.1,-2.4 1.1,-3.8C16.5,4.9 12,2 12,2zM12,20.8c-1.7,0 -3,-1 -3,-2.8 0,-1.4 1,-2.7 2.1,-3.7 -0.2,1.1 0.1,2.2 0.9,2.9 0.8,-0.7 1.1,-1.8 0.9,-2.9 1.1,1 2.1,2.3 2.1,3.7 0,1.8 -1.3,2.8 -3,2.8z" />
          </vector>
          XML
          cat > android/app/src/main/res/drawable/prepxai_icon.xml <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/prepxai_icon_background" />
            <item
                android:width="72dp"
                android:height="72dp"
                android:gravity="center"
                android:drawable="@drawable/prepxai_flame" />
          </layer-list>
          XML
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/prepxai_colors.xml <<'XML'
          <resources>
            <color name="prepxai_icon_background">#4F46E5</color>
          </resources>
          XML
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/prepxai_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/prepxai_icon"')
          p.write_text(s)
          assert '@drawable/prepxai_icon' in s
          PY
          sed -i 's/versionCode [0-9][0-9]*/versionCode 3/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.2"/' android/app/build.gradle

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload PrepXAI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepXAI-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to website
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/PrepXAI.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/PrepXAI.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest PrepXAI Android APK"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git pull --rebase origin main
            done
            exit 1
          fi
