name: PrepXAI Android Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp public/prepxai_app_icon.jpg android/app/src/main/res/drawable-nodpi/prepxai_icon.jpg
          python - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/prepxai_icon"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/prepxai_icon"', s, count=1)
          else:
              s = s.replace('android:icon="@drawable/prepxai_icon"', 'android:icon="@drawable/prepxai_icon"\n        android:roundIcon="@drawable/prepxai_icon"', 1)
          if 'co.prepxai.app' not in s:
              intent = '''            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="co.prepxai.app" android:host="auth" android:pathPrefix="/callback" />
            </intent-filter>
'''
              s = s.replace('</activity>', intent + '        </activity>', 1)
          manifest.write_text(s)

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text()
          g = re.sub(r'versionCode\s+\d+', 'versionCode 7', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.6"', g, count=1)
          gradle.write_text(g)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" PrepXAI-1.0.6.apk
          ls -lh PrepXAI-1.0.6.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: PrepXAI Android v1.0.6
          body: PrepXAI Android version 1.0.6
          files: PrepXAI-1.0.6.apk
          overwrite_files: true
          make_latest: true
